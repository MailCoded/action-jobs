name: notify
description: Send a notification through Apprise. Does nothing when no URLs are configured and never fails the job.

inputs:
  urls:
    description: Apprise URLs separated by spaces, commas or newlines (secret APPRISE_URLS). Empty disables notifications.
    required: false
    default: ""
  title:
    description: Notification title.
    required: false
    default: ""
  body:
    description: Notification body. A default that links to the workflow run is used when empty.
    required: false
    default: ""
  status:
    description: Module status (done, fatal or failed); selects the Apprise notification type.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send notification
      shell: bash
      continue-on-error: true
      env:
        APPRISE_URLS: ${{ inputs.urls }}
        NOTIFY_TITLE: ${{ inputs.title }}
        NOTIFY_BODY: ${{ inputs.body }}
        NOTIFY_STATUS: ${{ inputs.status }}
        APPRISE_VERSION: "1.13.1"
      run: '"$GITHUB_ACTION_PATH/notify.sh"'
