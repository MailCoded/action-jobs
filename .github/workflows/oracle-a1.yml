name: oracle-a1

on:
  workflow_dispatch:
    inputs:
      capacity_check:
        description: "Gate each attempt on a compute capacity report"
        type: boolean
        default: true
      try_fault_domains:
        description: "Also try FAULT-DOMAIN-1..3 explicitly"
        type: boolean
        default: false
  schedule:
    - cron: "4,19,34,49 * * * *"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: oracle-a1
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    shell: bash

jobs:
  provision:
    if: vars.ORACLE_A1_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # Setup, MAX_RUN_SECONDS, one late launch's retry budget and its 10m create wait must all fit.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Set up OCI CLI and credentials
        uses: ./.github/actions/setup-oci
        with:
          tenancy-ocid: ${{ secrets.OCI_TENANCY_OCID }}
          user-ocid: ${{ secrets.OCI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          region: ${{ vars.OCI_REGION || 'ap-sydney-1' }}

      - name: Run oracle-a1 module
        id: run
        env:
          TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION || 'ap-sydney-1' }}
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_STATE_NAMESPACE: ${{ secrets.OCI_STATE_NAMESPACE }}
          TF_VAR_ssh_public_key: ${{ secrets.ORACLE_A1_SSH_PUBLIC_KEY }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_existing_subnet_id: ${{ secrets.OCI_SUBNET_OCID }}
          OCPUS: ${{ vars.ORACLE_A1_OCPUS || '2' }}
          MEMORY_GB: ${{ vars.ORACLE_A1_MEMORY_GB || '12' }}
          # Dispatch inputs are unset on schedule; both expressions yield "true"/"false" for either trigger.
          CAPACITY_CHECK: ${{ github.event_name != 'workflow_dispatch' || inputs.capacity_check }}
          TRY_FAULT_DOMAINS: ${{ github.event_name == 'workflow_dispatch' && inputs.try_fault_domains }}
          TF_DIR: ${{ github.workspace }}/modules/oracle-a1/terraform
        run: |
          rc=0
          ./modules/oracle-a1/run.sh || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0 | 2 | 3) exit 0 ;;
            *) exit "$rc" ;;
          esac

      - name: Disable schedule after success
        id: disable
        if: steps.run.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A run queued behind the successful one still starts after the disable; stay quiet then.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/oracle-a1.yml" --jq .state 2>/dev/null || true)"
          if [[ "$state" == "disabled_manually" ]]; then
            echo "already_disabled=true" >> "$GITHUB_OUTPUT"
            echo "The workflow was already disabled by an earlier successful run; not notifying again."
            exit 0
          fi
          if gh workflow disable oracle-a1.yml --repo "$GITHUB_REPOSITORY"; then
            echo "Workflow disabled (schedule and manual runs). Re-enable with: gh workflow enable oracle-a1.yml"
          else
            echo "::warning::Could not disable the oracle-a1 workflow. Disable it manually under Actions to stop polling."
          fi

      - name: Open an issue announcing the instance
        if: steps.run.outputs.exit_code == '0' && steps.disable.outputs.already_disabled != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.run.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Assigned and mentioned by the Actions bot, so the owner gets a GitHub (Mobile) notification.
          title="oracle-a1: the A1 instance is ready"
          body="$(cat <<EOF
          @${GITHUB_REPOSITORY_OWNER} the oracle-a1 workflow finished with \`done\` (\`${REASON}\`): the Always Free A1 instance is up.

          The public IP and the SSH command are in the job summary of the run: ${RUN_URL}

          The workflow has disabled itself. Re-enable it with \`gh workflow enable oracle-a1.yml\` only if you want another attempt, for example after terminating the instance. Close this issue once you have logged in.
          EOF
          )"
          if gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"; then
            exit 0
          fi
          echo "::warning::Could not assign the announcement issue; opening it unassigned (the @mention still notifies)."
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" ||
            echo "::warning::Could not open the announcement issue. Check that Issues are enabled for this repository."

      - name: Notify
        if: always() && steps.disable.outputs.already_disabled != 'true' && (steps.run.outputs.status == 'done' || steps.run.outputs.status == 'fatal' || failure())
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          urls: ${{ secrets.APPRISE_URLS }}
          status: ${{ steps.run.outputs.status || 'failed' }}
          title: "oracle-a1: ${{ steps.run.outputs.status || 'failed' }}"
          body: ${{ steps.run.outputs.message }}
